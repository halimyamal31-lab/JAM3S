name: Build JAM3S Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE project
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target JAM3S_VST3 --parallel 2
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc "installer\JAM3S.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: JAM3S-Windows-Installer
          path: dist/JAM3S_Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: JAM3S-Windows-VST3
          path: build/JAM3S_artefacts/Release/VST3/
          if-no-files-found: error
